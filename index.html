<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>债市前瞻 · 中国债券市场周度展望</title>
<style>
:root{--bg:#f4f6fa;--card:#ffffff;--ink:#1f2430;--sub:#5a6472;--line:#e4e8ef;--accent:#2f6df6;--gold:#c9940a;--red:#e5484d;--green:#2f9e44;}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:16px/1.8 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:860px;margin:0 auto;padding:16px 16px 60px}
header{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,#1d3557,#2f6df6);color:#fff;border-radius:14px;padding:18px 18px 14px;margin-bottom:14px;box-shadow:0 6px 20px rgba(47,109,246,.28)}
.brand{font-size:19px;font-weight:700;letter-spacing:.5px}
.brand .en{font-size:12px;font-weight:400;opacity:.8;margin-left:6px}
.picker{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.picker label{font-size:13px;opacity:.92}
.picker select{flex:1;min-width:220px;appearance:none;-webkit-appearance:none;background:#fff;color:#1f2430;border:none;border-radius:9px;padding:9px 14px;font-size:14.5px;font-weight:600;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.picker .hint{font-size:12px;opacity:.85}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 22px 10px;box-shadow:0 2px 10px rgba(20,30,60,.05)}
h1,h2,h3,h4{line-height:1.4;color:var(--ink)}
h1{font-size:21px;margin:.2em 0 .6em}
h2{font-size:18px;margin:1.2em 0 .5em;padding-left:11px;border-left:4px solid var(--accent)}
h3{font-size:16px;margin:1em 0 .4em;color:#2b3a55}
h4{font-size:14.5px;margin:.8em 0 .3em;color:var(--sub)}
p{margin:.55em 0}
a{color:var(--accent);word-break:break-all}
blockquote{margin:.8em 0;padding:10px 15px;background:#f0f5ff;border-left:4px solid var(--accent);border-radius:8px;color:var(--sub)}
blockquote p{margin:.3em 0}
code{background:#eef1f6;padding:1px 6px;border-radius:5px;font-size:13.5px;font-family:ui-monospace,Menlo,Consolas,monospace}
table{border-collapse:collapse;width:100%;margin:.7em 0;font-size:13.5px;display:block;overflow-x:auto;white-space:nowrap}
th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{background:#eef3ff;color:#283a5e;font-weight:600;position:sticky;top:0}
tr:nth-child(even) td{background:#fafbfd}
ul,ol{padding-left:1.3em;margin:.5em 0}
li{margin:.28em 0}
hr{border:none;border-top:1px solid var(--line);margin:1.2em 0}
.foot{color:var(--sub);font-size:12px;text-align:center;margin-top:26px;line-height:1.6}
strong{color:#16243f}
.empty{color:var(--sub);text-align:center;padding:40px 0}
@media(max-width:520px){.card{padding:16px 14px 6px}header{padding:14px 14px 12px}.brand{font-size:17px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">📊 债市前瞻<span class="en">China Bond Market Weekly Outlook</span></div>
    <div class="picker">
      <label for="issueSel">选择期数</label>
      <select id="issueSel"></select>
      <span class="hint">默认最新一期，历史期数可随时切换</span>
    </div>
  </header>
  <div class="card" id="content"><div class="empty">正在加载…</div></div>
  <div class="foot">本页由自动化任务生成并部署，数据来源：国家统计局、中国人民银行官网、财政部、中国债券信息网、金融时报、中国金融新闻网、新华财经、财联社、CF40、《中国货币市场》、Wind 等公开信息整理。市场机构观点仅供参考，不构成投资建议。</div>
</div>
<script src="data.js"></script>
<script>
(function(){
  var issues = window.OUTLOOK_ISSUES || [];
  var sel = document.getElementById('issueSel');
  var content = document.getElementById('content');
  if(!issues.length){ content.innerHTML = '<div class="empty">暂无数据</div>'; return; }
  issues.forEach(function(it, i){
    var o = document.createElement('option');
    o.value = i;
    o.textContent = it.date + '  ·  ' + it.id;
    sel.appendChild(o);
  });
  sel.value = issues.length - 1;
  function render(i){
    var it = issues[i];
    content.innerHTML = it.html;
    document.title = it.title + ' · 债市前瞻';
  }
  sel.addEventListener('change', function(){ render(parseInt(sel.value,10)); });
  render(issues.length - 1);
})();
</script>
</body>
</html>
